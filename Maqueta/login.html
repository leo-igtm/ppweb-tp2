<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión </title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bg-primary text-white p-3 d-flex align-items-center">
    <img src="img/logo.webp" alt="Logo Inmobiliaria" width="80" class="me-3">
    <h1 class="h3 mb-0">Inmobiliaria TP2</h1>
    <nav class="ms-auto">
      <a href="index.html" class="text-white me-3">Inicio</a>
      <a href="propiedades.html" class="text-white me-3">Propiedades</a>
      <a href="contacto.html" class="text-white me-3">Contacto</a>
      <a href="usuarios.html" class="text-white me-3">CRUD Usuarios</a>
      <a href="login.html" class="text-white">Iniciar Sesión</a>
    </nav>
  </header>
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow p-4">
          <h2 class="mb-4 text-center">Iniciar Sesión</h2>
          <form onsubmit="window.location.href='index.html'; return false;">
            <div class="mb-3">
              <label for="email" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="email" name="email" required placeholder="nombre@correo.com">
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="password" name="password" required placeholder="Contraseña">
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
          </form>
          <div class="text-center mt-3">
            <a href="#" class="link-primary">¿Olvidaste tu contraseña?</a>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer class="bg-dark text-white text-center py-2 mt-4">
    <p class="mb-0">© 2025 Inmobiliaria TP2</p>
  </footer>
</body>
</html>
