<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contacto - Inmobiliaria TP2</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bg-primary text-white p-3 d-flex align-items-center">
    <img src="img/logo.webp" alt="Logo Inmobiliaria" width="80" class="me-3">
    <h1 class="h3 mb-0">Contacto</h1>
    <nav class="ms-auto">
      <a href="index.html" class="text-white me-3">Inicio</a>
      <a href="propiedades.html" class="text-white me-3">Propiedades</a>
      <a href="contacto.html" class="text-white me-3">Contacto</a>
      <a href="login.html" class="text-white">Iniciar Sesión</a>
    </nav>
  </header>
  <main class="container my-5">
    <h2>Formulario de Contacto</h2>
    <form class="p-4 border rounded bg-white shadow-sm" style="max-width: 500px; margin: auto;">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre:</label>
        <input type="text" class="form-control" id="nombre" name="nombre" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email:</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <div class="mb-3">
        <label for="mensaje" class="form-label">Mensaje:</label>
        <textarea class="form-control" id="mensaje" name="mensaje" rows="4" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary w-100">Enviar</button>
    </form>
    <div class="text-center mt-3">
      <p>Puedes escribirnos también a <a href="mailto:info@tp2.com">info@tp2.com</a></p>
    </div>
  </main>
  <footer class="bg-dark text-white text-center py-2">
    <p class="mb-0">© 2025 Inmobiliaria TP2</p>
  </footer>
</body>
</html>
